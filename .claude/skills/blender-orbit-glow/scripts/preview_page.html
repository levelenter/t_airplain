<!doctype html><html><body style="margin:0;background:#000">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search);const glb=q.get('glb')||'model.glb';const cz=parseFloat(q.get('cz')||'2.2');const dist=parseFloat(q.get('dist')||'9.5');
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(800,800);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x000000);
const cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.set(0,cz+dist*.13,dist);cam.lookAt(0,cz,0);
const g=await new GLTFLoader().loadAsync(glb);
// Same treatment as the runtime additive-glow component.
g.scene.traverse(o=>{if(o.isMesh){o.material.blending=THREE.AdditiveBlending;o.material.transparent=true;o.material.depthWrite=false;}});
sc.add(g.scene);
const mixer=new THREE.AnimationMixer(g.scene);mixer.clipAction(g.animations[0]).play();
window.renderAt=(t)=>{mixer.setTime(t);r.render(sc,cam);};
window.renderAt(0.5);window.ready=true;
</script></body></html>
