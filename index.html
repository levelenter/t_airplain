<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>所沢航空発祥記念館 WebAR</title>

    <!--
      @8thwall/landing-page の CSS は .landing8-logo-section に margin:0 auto を当てつつ、
      画面幅 768px 以上では margin-right:0 で打ち消している。
      その結果 margin-left だけが auto となり、powered by 8thWall のロゴが右に寄ってしまうため、
      左右とも auto に戻して中央寄せにする
    -->
    <style>
      .landing8-logo-section {
        margin-left: auto !important;
        margin-right: auto !important;
      }
    </style>

    <!-- 8-Frame: 8th Wall が調整した A-Frame 1.5.0（OSS）。a-scene より先に同期読み込みする -->
    <script src="/scripts/8frame-1.5.0.min.js"></script>

    <!--
      8th Wall Engine（Distributed Engine Binary）: SLAM チャンク込みで 6DoF ワールドトラッキングを有効化。
      CDN（cdn.jsdelivr.net）には依存せず、npm パッケージから取得した dist 一式を
      public/scripts/vendor/ 配下にそのまま置いてローカル配信する
      （取得元・再取得手順は public/scripts/vendor/README.md を参照）。
      ローカル配信のため crossorigin/integrity は不要。
    -->
    <script
      src="/scripts/vendor/@8thwall/engine-binary@1.0.0/dist/xr.js"
      async
      data-preload-chunks="slam"
    ></script>

    <!-- 8th Wall OSS ヘルパー群（MIT License）。こちらもローカル配信。 -->
    <script src="/scripts/vendor/@8thwall/landing-page@1.0.0/dist/landing-page.js"></script>
    <script src="/scripts/vendor/@8thwall/xrextras@1.0.0/dist/xrextras.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
